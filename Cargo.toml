[package]
name = "metal-gpu"
version = "0.1.0"
edition = "2024"
description = "Simple and safe Rust Metal renderer"
license = "MIT"
documentation = "https://docs.rs/metal-gpu"
repository = "https://github.com/Keegan-Wilgermein/metal-gpu"
keywords = ["metal", "gpu", "renderer", "graphics", "api"]
categories = ["graphics", "os::macos-apis"]

[dependencies]
objc2 = "0.6.5"
objc2-core-graphics = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["MTLDevice", "MTLTypes", "MTLBuffer"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }
